<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src blob: data:; media-src blob:; connect-src 'self'; base-uri 'none'; form-action 'none';">
  <title>GPX Route Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- クリックジャッキング防御画面 -->
  <div id="frameBlocked" class="frame-blocked" hidden>
    セキュリティ保護のため、外部フレーム（iframe）内での実行はブロックされています。直接ウィンドウで開いてください。
  </div>

  <!-- フルスクリーン・ドラッグ＆ドロップオーバーレイ -->
  <div id="dropOverlay" class="drop-overlay" hidden>
    <div class="drop-overlay-box">
      <strong>📂 ファイルをドロップして読み込み</strong>
      <span>GPXログ (.gpx) ／ 背景写真 (.jpg, .png, .webp) ／ プロジェクト (.json)</span>
    </div>
  </div>

  <!-- メインワークステーション -->
  <div id="appRoot" class="workstation">

    <!-- ==================== 上部：スリムコマンドバー ==================== -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <div class="mark" aria-hidden="true">⛰</div>
          <span class="brand-name">GPX Route Studio</span>
        </div>

        <div class="divider-v"></div>

        <div class="toolbar-group">
          <label id="fileZone" class="btn btn-ghost" tabindex="0" title="GPX・背景写真・プロジェクトJSONを選択（画面への直接ドロップも可）">
            <span>📂 素材を開く</span>
            <input type="file" id="fileInput" accept=".gpx,application/gpx+xml,text/xml,image/jpeg,image/png,image/webp,.json,application/json" multiple>
          </label>
          <button type="button" id="btnSample" class="btn btn-ghost" title="sample_routegpx.gpx を読み込みます">サンプル</button>
          <button type="button" id="btnClearPhoto" class="btn btn-ghost" disabled title="背景写真を解除します">写真解除</button>
        </div>

        <div class="divider-v"></div>

        <div class="toolbar-group">
          <button type="button" id="btnSaveProject" class="btn btn-ghost" title="編集状態をJSON保存">💾 保存</button>
          <button type="button" id="btnLoadProject" class="btn btn-ghost" title="プロジェクトJSONを読込">📁 読込</button>
          <input type="file" id="projectInput" accept=".json,application/json" hidden>
          <button type="button" id="btnResetAll" class="btn btn-ghost" title="初期状態にリセット">リセット</button>
        </div>
      </div>

      <div class="topbar-right">
        <button type="button" id="btnSelfTest" class="btn btn-ghost" title="自己診断テスト">診断</button>
        <a href="guide.html" class="btn btn-ghost" title="動画編集ソフト別の合成ガイド">📖 ガイド</a>
        <div class="divider-v"></div>
        <button type="button" id="btnExportPng" class="btn btn-secondary">📷 静止画保存 (.png)</button>
        <button type="button" id="btnExportVideo" class="btn btn-primary">🎬 動画書き出し (.webm)</button>
      </div>
    </header>

    <!-- ==================== 中央：3ペイン・メインワークスペース ==================== -->
    <main class="workspace-grid">

      <!-- 【左ペイン】配置プリセット ＆ Waypoint管理 -->
      <aside class="side-pane pane-left" aria-label="配置とWaypoint管理">

        <!-- 1. 配置プリセット -->
        <section class="pane-section">
          <div class="section-title-row">
            <h2>表示位置・スケール</h2>
            <span id="zoomBadge" class="val-badge" hidden>55%</span>
          </div>

          <div class="thumbs" id="presetThumbs" role="group" aria-label="表示位置プリセット">
            <button type="button" class="thumb" data-preset="full" title="全画面（中央配置）">
              <canvas width="160" height="90"></canvas>
              <span>全画面</span>
            </button>
            <button type="button" class="thumb" data-preset="br" title="右下ミニマップ">
              <canvas width="160" height="90"></canvas>
              <span>右下</span>
            </button>
            <button type="button" class="thumb" data-preset="bl" title="左下ミニマップ">
              <canvas width="160" height="90"></canvas>
              <span>左下</span>
            </button>
            <button type="button" class="thumb" data-preset="tr" title="右上ミニマップ">
              <canvas width="160" height="90"></canvas>
              <span>右上</span>
            </button>
            <button type="button" class="thumb" data-preset="tl" title="左上ミニマップ">
              <canvas width="160" height="90"></canvas>
              <span>左上</span>
            </button>
          </div>

          <div class="slider-row">
            <label for="zoomRange">拡大率 (%)</label>
            <input type="range" id="zoomRange" min="0.15" max="3.0" step="0.01" value="0.55">
            <input type="number" id="zoomNum" class="num-box" min="15" max="300" step="1" value="55">
          </div>
        </section>

        <!-- 2. Waypointリスト -->
        <section class="pane-section section-grow">
          <div class="section-title-row">
            <h2>Waypoint（地名・点滅）</h2>
            <div class="inline-actions">
              <button type="button" id="btnBlinkAllOn" class="btn-link">全点滅</button>
              <button type="button" id="btnBlinkAllOff" class="btn-link">全解除</button>
              <button type="button" id="btnLabelAllToggle" class="btn-link">表示切替</button>
            </div>
            <span id="blinkCountBadge" hidden>1</span>
          </div>

          <div id="wptTableBody" class="wpt-list" role="region" aria-label="Waypointリスト"></div>
          <select id="wptSelect" hidden></select>
        </section>

        <!-- 3. ルートシーク＆地点追加 -->
        <section class="pane-section">
          <div class="section-title-row">
            <h2>ルート位置シーク・追加</h2>
            <span id="seekBadge" class="val-badge">50%</span>
          </div>

          <input type="range" id="routeSeekRange" min="0" max="1000" value="500" title="ルート上の位置を移動">

          <div class="row-gap">
            <button type="button" id="btnToggleSeekBlink" class="btn btn-sm btn-full" aria-pressed="false">シーク位置を点滅: OFF</button>
          </div>

          <div class="input-group">
            <input type="text" id="newSeekWptInput" class="text-box" maxlength="40" placeholder="地名を入力して追加...">
            <button type="button" id="btnAddWptAtSeek" class="btn btn-sm btn-secondary">＋ 追加</button>
          </div>
        </section>

      </aside>

      <!-- 【中央ペイン】16:9 プレビュービューポート -->
      <section class="viewport-pane" aria-label="プレビュー">

        <div class="viewport-bar">
          <div class="viewport-meta">
            <span id="pointBadge" class="meta-pill">0 pts</span>
            <span id="metaInfo" class="meta-text">GPXファイルをドロップしてください</span>
          </div>
          <div class="viewport-tools">
            <button type="button" id="btnToggleGuide" class="btn btn-xs" aria-pressed="false" title="16:9セーフティ枠の表示切替 [G]">ガイド枠: OFF</button>
            <button type="button" id="btnResetAnim" class="btn btn-xs" title="アニメーションを0秒へリセット [Space]">⏮ 先頭再生</button>
          </div>
        </div>

        <div class="preview" id="previewContainer">
          <div id="emptyState" class="empty">
            <strong>GPXファイルをドロップして開始</strong>
            <span>.gpx ／ 背景写真 ／
